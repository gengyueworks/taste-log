name: 每日候选雷达 · Daily Candidate Radar

on:
  schedule:
    # 北京时间 09:30 跑（UTC 01:30）。改时间改这里。
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run candidate radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/candidate-radar.py
