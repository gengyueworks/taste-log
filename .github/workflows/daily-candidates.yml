name: 每日候选雷达 · Daily Candidate Radar

on:
  schedule:
    # 北京时间 09:30 跑（UTC 01:30）。改时间改这里。
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run candidate radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/candidate-radar.py

      - name: Commit daily pick record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-picks.json
          if git diff --cached --quiet; then
            echo "今日记录无变化，跳过 commit"
          else
            git commit -m "chore: 每日推荐记录 $(date +%Y-%m-%d)"
            git push
          fi
